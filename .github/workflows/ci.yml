# CI: lint, typecheck+build, unit tests.
# No deploys from CI — Vercel builds the frontend on push; Convex prod deploys
# stay manual (`npx convex deploy`) until a CONVEX_DEPLOY_KEY story is decided.
#
# There is deliberately no storybook job. This workflow was imported from
# backup/opus-prod-readiness-20260714 without the Storybook setup it depends on
# — that branch carries .storybook/, three .stories.tsx files and a vitest
# `projects: [...]` config defining the "storybook" project. On master none of
# that exists, so the job installed Chromium and then died on "No projects
# matched the filter \"storybook\"" — every run, testing zero stories. Re-add
# the job together with that setup, not before it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: node scripts/design-lint.mjs

  build:
    runs-on: ubuntu-latest
    env:
      # Read at runtime by the client, but set a placeholder so bundle-time
      # env inlining never produces an undefined URL.
      VITE_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # tsc -b && vite build — covers typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit
